[package]
name = "rust-executor"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"
raw-window-handle = "0.6"
ash = "0.38"
ash-window = "0.13"
gpu-allocator = "0.27"
imgui = "0.12"
imgui-rs-vulkan-renderer = { version = "1.16", features = ["gpu-allocator"] }
imgui-winit-support = "0.13"
skia-safe = { version = "0.99", features = ["gpu", "vulkan"] }
async-trait = "0.1"
kira = "0.12.1"
rand = "0.10.2"
naga = { version = "26", features = ["wgsl-in", "spv-out"] }
ndarray = "0.17.2"
num-traits = "0.2.19"
itertools = "0.15.0"
parking_lot = "0.12.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"
